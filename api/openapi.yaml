openapi: "3.0.3"
info:
  title: InWheel API
  version: "1.0.0"
  description: |
    Public REST API for the InWheel accessibility platform.
    All data endpoints are versioned under /v1/.
    Probe endpoints (/healthz, /readyz) are unversioned.

servers:
  - url: /v1

security: []  # most endpoints are public; overridden per-operation

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:

    # ── Enum helpers ──────────────────────────────────────────────────────────

    DoorType:
      type: string
      enum: [automatic, manual, revolving, none]

    SurfaceType:
      type: string
      enum: [asphalt, paving_stones, cobblestone, gravel, concrete, wood, carpet, tiles]

    AccessibilityLevel:
      type: string
      description: |
        Traffic-light rating for a measurement field, submitted directly rather
        than measured. `good` and `limited` bands, and the `no` cutoff, are
        defined per-field against SIA 500 or ADA and documented on that field.
      enum: [good, limited, no]

    Category:
      type: string
      description: |
        Broad place type used for filtering and icon selection.
        `entrance` and `toilet` denote standalone accessibility-relevant
        features rather than full venues; `other` is the ingestion fallback
        for buildings that don't fit a more specific category.
      enum:
        - mall
        - airport
        - train_station
        - restaurant
        - cafe
        - shop
        - toilet
        - parking
        - entrance
        - other

    OSMType:
      type: string
      description: OpenStreetMap element type this place was ingested from.
      enum: [node, way, relation]

    PlaceStatus:
      type: string
      description: |
        Lifecycle state of an OSM-sourced place. `osm_removed` means the
        backing OSM element was deleted upstream but the place record is
        kept to preserve any user-submitted accessibility data.
      enum: [active, closed, osm_removed]

    # ── Domain types — reuse existing Go structs via x-go-type ───────────────
    # x-go-type tells oapi-codegen "don't generate a new struct, use this one".
    # The spec schema still drives middleware validation; the Go type is imported.

    DoorProps:
      x-go-type: models.DoorProps
      x-go-type-import:
        name: models
        path: github.com/InWheelOrg/inwheel-api/pkg/models
      type: object
      properties:
        type:
          $ref: "#/components/schemas/DoorType"
        width:
          allOf:
            - $ref: "#/components/schemas/AccessibilityLevel"
          description: "Clear opening width. good >=0.80m, limited 0.70-0.80m, no <0.70m (SIA 500)."

    EntranceProps:
      x-go-type: models.EntranceProps
      x-go-type-import:
        name: models
        path: github.com/InWheelOrg/inwheel-api/pkg/models
      type: object
      properties:
        is_level:
          type: boolean
        has_fixed_ramp:
          type: boolean
        has_removable_ramp:
          type: boolean
        slope_percent:
          allOf:
            - $ref: "#/components/schemas/AccessibilityLevel"
          description: "Ramp slope. good <=6%, limited 6-8.33%, no >8.33% (ADA)."
        width:
          allOf:
            - $ref: "#/components/schemas/AccessibilityLevel"
          description: "Clear opening width. good >=0.80m, limited 0.70-0.80m, no <0.70m (SIA 500)."
        door:
          $ref: "#/components/schemas/DoorProps"
        has_intercom:
          type: boolean
        audit_flags:
          type: array
          items:
            type: string
          readOnly: true

    PathwayProps:
      x-go-type: models.PathwayProps
      x-go-type-import:
        name: models
        path: github.com/InWheelOrg/inwheel-api/pkg/models
      type: object
      properties:
        width:
          allOf:
            - $ref: "#/components/schemas/AccessibilityLevel"
          description: "Narrowest passage width. good >=0.90m, limited 0.80-0.90m, no <0.80m (ADA)."
        surface:
          $ref: "#/components/schemas/SurfaceType"
        is_kerbstone_free:
          type: boolean
        has_steps:
          type: boolean
        audit_flags:
          type: array
          items:
            type: string
          readOnly: true

    RestroomProps:
      x-go-type: models.RestroomProps
      x-go-type-import:
        name: models
        path: github.com/InWheelOrg/inwheel-api/pkg/models
      type: object
      properties:
        is_accessible:
          type: boolean
        door_width:
          allOf:
            - $ref: "#/components/schemas/AccessibilityLevel"
          description: "Clear opening width. good >=0.80m, limited 0.70-0.80m, no <0.70m (SIA 500)."
        turning_radius:
          allOf:
            - $ref: "#/components/schemas/AccessibilityLevel"
          description: "good >=1.50m, limited 1.20-1.50m, no <1.20m (ADA)."
        has_grab_rails:
          type: boolean
        has_roll_in_shower:
          type: boolean
        toilet_seat_height:
          allOf:
            - $ref: "#/components/schemas/AccessibilityLevel"
          description: "good 0.43-0.48m, limited 0.40-0.43m or 0.48-0.50m, no outside that (ADA)."
        has_emergency_pull:
          type: boolean
        has_changing_table:
          type: boolean
        audit_flags:
          type: array
          items:
            type: string
          readOnly: true

    ParkingProps:
      x-go-type: models.ParkingProps
      x-go-type-import:
        name: models
        path: github.com/InWheelOrg/inwheel-api/pkg/models
      type: object
      properties:
        has_disabled_spaces:
          type: boolean
        count:
          type: integer
          minimum: 0
          maximum: 10000
        distance_to_entrance:
          allOf:
            - $ref: "#/components/schemas/AccessibilityLevel"
          description: "good <=25m, limited 25-50m, no >50m (ADA specifies no maximum; nearest available figure used)."
        width:
          allOf:
            - $ref: "#/components/schemas/AccessibilityLevel"
          description: "Parking space width. good >=2.40m, limited 2.00-2.40m, no <2.00m (ADA)."
        has_dedicated_signage:
          type: boolean
        audit_flags:
          type: array
          items:
            type: string
          readOnly: true

    ElevatorProps:
      x-go-type: models.ElevatorProps
      x-go-type-import:
        name: models
        path: github.com/InWheelOrg/inwheel-api/pkg/models
      type: object
      properties:
        width:
          allOf:
            - $ref: "#/components/schemas/AccessibilityLevel"
          description: "Cabin width. good >=1.70m, limited 1.50-1.70m, no <1.50m (ADA)."
        depth:
          allOf:
            - $ref: "#/components/schemas/AccessibilityLevel"
          description: "Cabin depth. good >=1.30m, limited 1.10-1.30m, no <1.10m (ADA)."
        door_width:
          allOf:
            - $ref: "#/components/schemas/AccessibilityLevel"
          description: "good >=0.90m, limited 0.80-0.90m, no <0.80m (ADA)."
        has_braille:
          type: boolean
        has_audio:
          type: boolean
        audit_flags:
          type: array
          items:
            type: string
          readOnly: true

    SourceReport:
      type: object
      required: [source, value, recorded_at]
      properties:
        source:
          type: string
          example: "osm"
        value:
          type: string
          example: "yes"
        recorded_at:
          type: string
          format: date-time

    AccessibilityProfile:
      x-go-type: models.AccessibilityProfile
      x-go-type-import:
        name: models
        path: github.com/InWheelOrg/inwheel-api/pkg/models
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        place_id:
          type: string
          format: uuid
          readOnly: true
        source_reports:
          type: array
          items:
            $ref: "#/components/schemas/SourceReport"
        entrance:
          $ref: "#/components/schemas/EntranceProps"
        pathways:
          $ref: "#/components/schemas/PathwayProps"
        restroom:
          $ref: "#/components/schemas/RestroomProps"
        parking:
          $ref: "#/components/schemas/ParkingProps"
        elevator:
          $ref: "#/components/schemas/ElevatorProps"
        updated_at:
          type: string
          format: date-time
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        user_verified:
          type: boolean
          readOnly: true

    ExternalRef:
      x-go-type: models.ExternalRef
      x-go-type-import:
        name: models
        path: github.com/InWheelOrg/inwheel-api/pkg/models
      type: object
      required: [id, confidence]
      properties:
        id:
          type: string
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        matched_at:
          type: string
          format: date-time

    Place:
      x-go-type: models.Place
      x-go-type-import:
        name: models
        path: github.com/InWheelOrg/inwheel-api/pkg/models
      type: object
      required: [name, lat, lng, category]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        osm_id:
          type: integer
          format: int64
          minimum: 0
        osm_type:
          $ref: "#/components/schemas/OSMType"
        name:
          type: string
          minLength: 1
          maxLength: 256
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        category:
          $ref: "#/components/schemas/Category"
        rank:
          type: integer
          description: |
            Display priority for map clients. 1 = landmark (shown at world
            zoom, e.g. airports, hospitals), 2 = establishment (standard
            commercial/public building), 3 = feature (minor utility, e.g.
            public toilets, ATMs — shown only at high zoom).
          enum: [1, 2, 3]
        parent_id:
          type: string
          format: uuid
        accessibility:
          $ref: "#/components/schemas/AccessibilityProfile"
        tags:
          type: object
          additionalProperties:
            type: string
        source:
          type: string
          maxLength: 64
        external_ids:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ExternalRef"
        status:
          $ref: "#/components/schemas/PlaceStatus"
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
      example:
        id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        osm_id: 123456789
        osm_type: "node"
        name: "Gare de Vevey"
        lng: 6.8422
        lat: 46.4632
        category: "train_station"
        rank: 1
        status: "active"
        accessibility:
          entrance:
            is_level: true
            width: "good"
            audit_flags: []

    # ── API-specific response envelopes ───────────────────────────────────────

    PlacePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Place"
        next_cursor:
          type: string
          description: >
            Opaque cursor for the next page. Absent when this is the last page.
            Re-send all filter params unchanged on each subsequent request.

    # ── Error shapes ─────────────────────────────────────────────────────────

    FieldError:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string

    ValidationError:
      type: object
      required: [error, fields]
      properties:
        error:
          type: string
          example: "validation failed"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Auth schemas ──────────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    RegisterResponse:
      type: object
      required: [api_key, email, created_at]
      properties:
        api_key:
          type: string
          description: Raw API key shown exactly once. Store it securely.
        email:
          type: string
        created_at:
          type: string
          format: date-time

paths:

  # ── Places ────────────────────────────────────────────────────────────────

  /places:
    get:
      operationId: listPlaces
      summary: List places with cursor-based pagination
      description: |
        Returns a page of places ordered by (updated_at DESC, id ASC).
        Supports three modes (mutually exclusive):
          - **Proximity**: `lng`, `lat`, `radius` — all three required together
          - **Bounding box**: `min_lng`, `min_lat`, `max_lng`, `max_lat` — all four required together
          - **Default**: most recently updated places
        `q` (case-insensitive substring match on `name`) composes with any of the three modes above.
        Re-send identical filter params on every subsequent page.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: lng
          in: query
          example: 6.8422
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: lat
          in: query
          example: 46.4632
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: radius
          in: query
          example: 500
          schema:
            type: number
            format: double
            minimum: 0
            exclusiveMinimum: true
            maximum: 50000
        - name: min_lng
          in: query
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: min_lat
          in: query
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: max_lng
          in: query
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: max_lat
          in: query
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
      responses:
        "200":
          description: Paginated list of places
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacePage"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

    post:
      operationId: createPlace
      summary: Create a place
      description: Creates a new place. Accessibility data may be included inline.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Place"
      responses:
        "201":
          description: Place created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /places/{id}:
    get:
      operationId: getPlace
      summary: Get a single place
      description: |
        Returns a place with its effective accessibility profile.
        For places with a parent, components are inherited from the parent
        for any component type the child does not define itself.
        Inherited components carry `is_inherited: true` and `source_id` of the parent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Place found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "400":
          description: Invalid UUID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Place not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /places/{id}/accessibility:
    patch:
      operationId: patchPlaceAccessibility
      summary: Update or create an accessibility profile
      description: |
        Upserts the accessibility profile for the given place.
        Audit flags are computed server-side from submitted property values.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessibilityProfile"
      responses:
        "200":
          description: Accessibility profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessibilityProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Place not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Auth ─────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      operationId: register
      summary: Register and receive an API key
      description: |
        Creates an API key for the given email address.
        The raw key is returned exactly once — store it immediately.
        Rate-limited to 3 registrations per IP per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "409":
          description: Active key already exists for this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/keys:
    delete:
      operationId: revokeKey
      summary: Revoke the authenticated API key
      description: Revokes the key used to authenticate this request.
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Key revoked
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
