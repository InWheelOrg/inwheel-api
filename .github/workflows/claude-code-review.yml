name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

jobs:
  claude-review:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read CLAUDE.md, then review this PR for must-fix issues only:
            - Bugs or logic errors, panics on untrusted input, PII in logs, missing auth on write endpoints
            - SQL / GORM queries built by concatenating user input instead of parameterised placeholders
            - Accessibility "scoring" or "decision" logic in handlers or services: the API is a pure data layer
            - `AuditFlags` written from client input or computed non-deterministically (clock, random, network)
            - Write endpoints not running validation -> a11y engine -> persist in that order; `DetectConflicts`
              errors must return 422, structural validation failures 400 with a field-level error list
            - JSONB custom types (`Geometry`, `PlaceTags`, component `Properties`) missing a symmetric
              `driver.Valuer` / `sql.Scanner` pair
            - Introduction of an HTTP framework (gin, chi, echo, fiber); handlers use stdlib `net/http`
            - New exported functions, handlers, repositories, or `internal/sources` implementations without
              tests for each meaningful branch, unless trivial pass-throughs

            Skip anything CI already enforces (go vet, golangci-lint, generated code, govulncheck, Trivy)
            and skip style, subjective, or hypothetical feedback.

            Post inline comments for must-fix issues, then one top-level summary — explicitly say "looks good"
            if there are none. Don't manufacture issues to appear thorough.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
